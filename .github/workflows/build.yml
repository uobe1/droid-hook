name: build

# Dispatch-only, like the sibling projects: a push must not silently consume an
# Action, and the same gate must not run twice.
#
# Release policy: a stable release is a git tag on a gated commit; the default
# branch is the permanent dev line and is never itself a release.  Providing
# `release_tag` at dispatch creates that annotated tag only after every gate
# above has passed on this commit.  No version bump or cadence is implied here.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Annotated git tag to create on this gated commit (empty = no release)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: droid-hook-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap gate first: host suites.  No DDK image, no kernel tree.  The library
  # TUs' kernel-mode syntax check (`make kcheck`) needs the AOSP headers, so it
  # runs locally; in CI the real kernel build below is strictly stronger.
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Host suites
        run: make check
      - name: Install static-analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck cppcheck
          python3 -m pip install --user --break-system-packages ruff yamllint 'clang-format==18.1.8'
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: shellcheck
        run: shellcheck tests/qemu/init-droid-hook
      - name: ruff
        run: ruff check tests/host
      - name: clang-format
        run: git ls-files -z '*.c' '*.h' | xargs -0 -r clang-format --dry-run --Werror
      - name: yamllint
        run: yamllint .github/workflows
      - name: actionlint
        run: actionlint
      - name: cppcheck (host-compilable C)
        run: |
          cppcheck --enable=warning,performance,portability --error-exitcode=1 \
            --std=c11 --suppress=missingIncludeSystem -Iinclude -Iruntime \
            src/*.c tests/host/*.c

  # Real kernel module build.  This is what proves droid_hook.ko compiles
  # against the android16-6.12 GKI kernel the device runs.
  build:
    needs: host
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android16-6.12-20260828
      options: --user root
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build droid_hook.ko
        shell: bash
        run: |
          set -euxo pipefail
          KDIR="/opt/ddk/kdir/android16-6.12"
          make -C "$KDIR" M="$GITHUB_WORKSPACE" modules
          mkdir -p out
          cp droid_hook.ko out/
          # Real assertions: the module must exist, carry the right name and a
          # vermagic.  No `|| true` here -- a missing/incorrect .ko must fail.
          test -s out/droid_hook.ko
          modinfo -F name out/droid_hook.ko | grep -qx droid_hook
          modinfo -F vermagic out/droid_hook.ko
          ls -l out
      - name: Build with runtime adapter (core ABI 5 header)
        shell: bash
        run: |
          set -euxo pipefail
          KDIR="/opt/ddk/kdir/android16-6.12"
          # Pin both the commit and the header digest: the runtime adapter must
          # compile against exactly the core ABI 5 header it was written for.
          # `main` still ships ABI 2, so pin the public commit on
          # feat/control-plane-iteration whose header is byte-identical to the
          # ABI 5 header this adapter was written against (sha256 below).
          CORE_INC="/tmp/dh-core-include"
          mkdir -p "$CORE_INC"
          CORE_URL="https://raw.githubusercontent.com/uobe1/droid-lkm-suite/f6d325be076416346523ee2dd9178b83960392e6/core/include/dnsk_core.h"
          curl -fsSL --retry 5 --retry-delay 2 -o "$CORE_INC/dnsk_core.h" "$CORE_URL"
          echo "7b4fb703bb8c99974e605bc2bf3fecaeae0e5c17a8ee9af5924dcfa0cae01a21  $CORE_INC/dnsk_core.h" | sha256sum -c -
          cp out/droid_hook.ko out/droid_hook-plain.ko
          make -C "$KDIR" M="$GITHUB_WORKSPACE" clean
          make -C "$KDIR" M="$GITHUB_WORKSPACE" DNSK_CORE_INC="$CORE_INC" modules
          cp droid_hook.ko out/droid_hook-runtime.ko
          # Hard assertions: the runtime TU must be linked into the second
          # module and must be absent from the plain one.  Print the matching
          # symbols so the run log itself is the link evidence.
          NM=$(command -v llvm-nm || command -v nm)
          echo "--- runtime symbols in droid_hook-runtime.ko ---"
          "$NM" out/droid_hook-runtime.ko | grep -E ' [Tt] dh_core_backend_(init|fini|page_size|set_page_size)$'
          echo "--- plain symbols (must be empty) ---"
          if "$NM" out/droid_hook-plain.ko | grep -E ' [Tt] dh_core_backend_(init|fini|page_size|set_page_size)$'; then
            echo "plain module unexpectedly contains the runtime adapter" >&2
            exit 1
          fi
          modinfo -F name out/droid_hook-runtime.ko | grep -qx droid_hook
          modinfo -F vermagic out/droid_hook-runtime.ko
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: droid-hook-android16-6.12
          path: out/
          if-no-files-found: error

  # Optional stable release: tag the commit only after host and kernel gates
  # passed.  A no-op unless the dispatcher supplied `release_tag`.
  release:
    needs: [host, build]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and push annotated tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never move or reuse an existing tag: a stable release is immutable.
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "tag ${RELEASE_TAG} already exists" >&2
            exit 1
          fi
          git tag -a "${RELEASE_TAG}" -m "droid-hook ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"
